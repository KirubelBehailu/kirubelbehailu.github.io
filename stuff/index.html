<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="stuff">
<meta name="color-scheme" content="light dark">
<title>stuff</title>
<style>
/* Layout: iOS-style large titles over a quiet grouped ground; one centered column; glass controls float above the content */
:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --surface-2: #ececf0;
  --fg: #1d1d1f;
  --muted: #6e6e73;
  --hair: rgba(60, 60, 67, .14);
  --accent: #0071e3;
  --accent-ink: #ffffff;
  --danger: #e0302a;
  --glass: rgba(255, 255, 255, .72);
  --glass-edge: rgba(255, 255, 255, .7);
  --glass-line: rgba(0, 0, 0, .06);
  --shadow: 0 12px 32px rgba(20, 20, 40, .10), 0 1px 3px rgba(20, 20, 40, .08);
  --scrim: rgba(10, 10, 20, .28);
  --mark: rgba(0, 113, 227, .16);
  --siri-1: #ff4f8b; --siri-2: #ff9a3c; --siri-3: #9b5cff; --siri-4: #2fb6ff;
  /* category tint lightness, saturation */
  --t-s: 72%; --t-l1: 96%; --t-l2: 87%; --t-ink: 42%; --p-l1: 91%; --p-l2: 79%;

  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --spring: cubic-bezier(.32, .72, 0, 1);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --r-tile: 24px;
  --r-group: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --fg: #f5f5f7; --muted: #98989f;
    --hair: rgba(255, 255, 255, .10); --accent: #2997ff; --accent-ink: #ffffff; --danger: #ff453a;
    --glass: rgba(38, 38, 42, .62); --glass-edge: rgba(255, 255, 255, .14); --glass-line: rgba(255, 255, 255, .08);
    --shadow: 0 12px 32px rgba(0, 0, 0, .55), 0 1px 3px rgba(0, 0, 0, .4); --scrim: rgba(0, 0, 0, .55);
    --mark: rgba(41, 151, 255, .28);
    --t-s: 46%; --t-l1: 19%; --t-l2: 11%; --t-ink: 72%; --p-l1: 27%; --p-l2: 15%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --fg: #f5f5f7; --muted: #98989f;
  --hair: rgba(255, 255, 255, .10); --accent: #2997ff; --accent-ink: #ffffff; --danger: #ff453a;
  --glass: rgba(38, 38, 42, .62); --glass-edge: rgba(255, 255, 255, .14); --glass-line: rgba(255, 255, 255, .08);
  --shadow: 0 12px 32px rgba(0, 0, 0, .55), 0 1px 3px rgba(0, 0, 0, .4); --scrim: rgba(0, 0, 0, .55);
  --mark: rgba(41, 151, 255, .28);
  --t-s: 46%; --t-l1: 19%; --t-l2: 11%; --t-ink: 72%; --p-l1: 27%; --p-l2: 15%;
  color-scheme: dark;
}

@property --a { syntax: "<angle>"; initial-value: 0deg; inherits: false; }

html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 400 17px/1.4 var(--font-text); letter-spacing: -.01em;
  -webkit-font-smoothing: antialiased; min-height: 100%;
  padding-bottom: 128px;
}
body.locked { overflow: hidden; }
[hidden] { display: none !important; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.ic { width: 22px; height: 22px; flex: none; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; }
@media (min-width: 700px) { .wrap { padding-inline: 32px; } }

/* ---------- Loader ---------- */
#loader {
  position: fixed; inset: 0; z-index: 100; background: var(--bg);
  display: grid; place-items: center; transition: opacity .55s var(--ease), transform .55s var(--ease);
}
#loader.done { opacity: 0; transform: scale(1.06); pointer-events: none; }
.loader-stack { position: relative; display: grid; place-items: center; }
.loader-glow {
  position: absolute; width: 260px; height: 140px; border-radius: 50%;
  background: conic-gradient(from var(--a), var(--siri-1), var(--siri-2), var(--siri-3), var(--siri-4), var(--siri-1));
  filter: blur(42px); opacity: 0;
  animation: glowIn 1.6s .35s var(--ease) forwards, spin 3s linear infinite;
}
.word {
  position: relative; margin: 0; font: 700 clamp(64px, 18vw, 112px)/1 var(--font-display);
  letter-spacing: -.045em; display: flex;
}
.word span { display: inline-block; animation: rise .95s var(--spring) both; }
.word span:nth-child(2) { animation-delay: .08s; } .word span:nth-child(3) { animation-delay: .16s; }
.word span:nth-child(4) { animation-delay: .24s; } .word span:nth-child(5) { animation-delay: .32s; }
@keyframes rise { from { opacity: 0; filter: blur(14px); transform: translateY(28px) scale(.94); } to { opacity: 1; filter: blur(0); transform: none; } }
@keyframes glowIn { 0% { opacity: 0; } 45% { opacity: .55; } 100% { opacity: .22; } }
@keyframes spin { to { --a: 360deg; } }

/* ---------- Headers ---------- */
.hero { padding-block: 28px 18px; }
.large { margin: 0; font: 700 34px/1.1 var(--font-display); letter-spacing: -.025em; text-wrap: balance; }
@media (min-width: 700px) { .large { font-size: 44px; } .hero { padding-block: 56px 24px; } }
.sub { margin: 6px 0 0; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.eyebrow { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; text-transform: uppercase; }

.navbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  transition: background .25s, box-shadow .25s;
}
.navbar.scrolled {
  background: var(--glass); box-shadow: 0 .5px 0 var(--hair);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
}
.navrow { height: 48px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.back { display: inline-flex; align-items: center; gap: 2px; color: var(--accent); font-size: 17px; margin-left: -8px; padding: 8px; justify-self: start; }
.back .ic { width: 24px; height: 24px; stroke-width: 2.4; }
.navtitle { font-weight: 600; font-size: 17px; opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50vw; }
.navbar.scrolled .navtitle { opacity: 1; transform: none; }
.cathead { padding-block: 4px 18px; }

/* ---------- Note ---------- */
.note {
  display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  background: var(--surface); border-radius: var(--r-group); padding: 12px 16px; margin-bottom: 16px;
  font-size: 15px; color: var(--muted);
}
.note p { margin: 0; min-width: 0; flex: 1 1 220px; }
.note strong { color: var(--fg); font-weight: 600; }
.linkbtn { color: var(--accent); font-size: 15px; font-weight: 500; padding: 4px 0; }
.linkbtn.armed { color: var(--danger); }

/* ---------- Category tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 600px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
@media (min-width: 900px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile {
  position: relative; overflow: hidden; aspect-ratio: 1 / 1; max-width: 100%; border-radius: var(--r-tile);
  padding: 16px; display: flex; flex-direction: column; align-items: flex-start; text-align: left;
  background: linear-gradient(155deg, hsl(var(--h) var(--t-s) var(--t-l1)), hsl(var(--h) var(--t-s) var(--t-l2)));
  color: var(--fg);
  transition: transform .35s var(--spring), box-shadow .35s var(--ease);
  isolation: isolate;
}
@media (hover: hover) { .tile:hover { transform: translateY(-3px); box-shadow: var(--shadow); } }
.tile:active { transform: scale(.97); }
.tile-name { font: 600 19px/1.2 var(--font-display); letter-spacing: -.015em; }
.tile-count { margin-top: 2px; font-size: 14px; color: hsl(var(--h) 25% var(--t-ink)); font-variant-numeric: tabular-nums; }
.tile-art {
  position: absolute; z-index: -1; width: 78%; height: 78%; right: -10%; bottom: -12%;
  color: hsl(var(--h) var(--t-s) var(--t-ink)); stroke-width: 1.15; opacity: .9;
  transition: transform .5s var(--spring);
}
@media (hover: hover) { .tile:hover .tile-art { transform: rotate(-6deg) scale(1.04); } }
.tile-new {
  background: transparent; border: 2px dashed var(--hair); color: var(--accent);
  align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 16px;
}
.tile-new .ic { width: 30px; height: 30px; }
.edit-badge {
  position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center; background: var(--glass); color: var(--fg);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 1px 4px var(--hair);
  opacity: 0; transform: scale(.6); transition: opacity .2s, transform .3s var(--spring);
}
.edit-badge .ic { width: 15px; height: 15px; }
body.editing .edit-badge { opacity: 1; transform: none; }
body:not(.editing) .edit-only { display: none !important; }
body.editing .tile:not(.tile-new) { animation: jiggle .3s ease-in-out infinite alternate; }
body.editing .tile:nth-child(2n) { animation-delay: -.15s; }
body.editing .tile:nth-child(3n) { animation-duration: .34s; }
@keyframes jiggle { from { transform: rotate(-.7deg); } to { transform: rotate(.7deg); } }

/* ---------- Photo grid ---------- */
.grid {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px;
  border-radius: 16px; overflow: hidden;
}
@media (min-width: 600px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; } }
@media (min-width: 900px) { .grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.cell { position: relative; aspect-ratio: 1 / 1; max-width: 100%; overflow: hidden; display: block; background: var(--surface-2); }
.cell img, .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cell > * { transition: transform .4s var(--spring), filter .2s; }
@media (hover: hover) { .cell:hover > * { transform: scale(1.04); } }
.cell:active > * { filter: brightness(.88); }
.cell-add {
  display: grid; place-items: center; align-content: center; gap: 6px; color: var(--accent);
  background: var(--surface); font-size: 13px; font-weight: 600;
}
.cell-add .ic { width: 28px; height: 28px; }
body.editing .cell:not(.cell-add)::after {
  content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 3px var(--accent); opacity: .0;
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse { 50% { opacity: .55; } }

.ph {
  width: 100%; height: 100%; display: grid; place-items: center; position: relative;
  background: radial-gradient(120% 95% at 28% 18%, hsl(var(--h) var(--t-s) var(--p-l1)), hsl(var(--h) var(--t-s) var(--p-l2)));
  color: hsl(var(--h) var(--t-s) var(--t-ink));
}
.ph .ic { width: 44%; height: 44%; stroke-width: 1.3; }
.ph-cap {
  position: absolute; left: 8px; right: 8px; bottom: 7px; font-size: 11px; font-weight: 600; line-height: 1.2;
  color: hsl(var(--h) 30% var(--t-ink)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.empty { text-align: center; color: var(--muted); padding: 48px 16px; font-size: 15px; }
.empty .ic { width: 40px; height: 40px; margin-bottom: 8px; opacity: .6; }

/* ---------- Views ---------- */
#view.fwd { animation: pushIn .45s var(--spring) both; }
#view.back { animation: popIn .45s var(--spring) both; }
@keyframes pushIn { from { opacity: 0; transform: translateX(40px); } }
@keyframes popIn { from { opacity: 0; transform: translateX(-40px); } }

/* ---------- Bottom bar ---------- */
#bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; pointer-events: none;
  display: flex; justify-content: center; padding: 0 16px calc(18px + env(safe-area-inset-bottom, 0px));
}
.pill-wrap { position: relative; pointer-events: auto; border-radius: 999px; }
.pill {
  position: relative; height: 56px; width: 124px; border-radius: 999px;
  display: flex; align-items: center; padding: 0 6px;
  background: var(--glass); box-shadow: var(--shadow), inset 0 0 0 .5px var(--glass-edge);
  -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);
  transition: width .5s var(--spring);
}
.pbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; transition: background .2s, color .2s, transform .2s var(--spring); }
.pbtn:active { transform: scale(.9); }
.pbtn .ic { width: 23px; height: 23px; }
.sep { width: 1px; height: 24px; background: var(--hair); margin: 0 7px; flex: none; }
#q {
  flex: 1; min-width: 0; height: 44px; border: 0; outline: 0; background: transparent;
  font-size: 17px; padding: 0 4px; display: none;
}
#q::placeholder { color: var(--muted); }
#q::-webkit-search-cancel-button { display: none; }
#btnClose { display: none; }
body.searching .pill { width: min(580px, calc(100vw - 32px)); }
body.searching #q, body.searching #btnClose { display: grid; }
body.searching #q { display: block; }
body.searching #btnEdit, body.searching .sep { display: none; }
body.searching #btnSearch { pointer-events: none; color: var(--muted); }
body.editing #btnEdit { background: var(--accent); color: var(--accent-ink); }
.glow, .ring {
  position: absolute; border-radius: 999px; pointer-events: none; opacity: 0; transition: opacity .4s var(--ease);
  background: conic-gradient(from var(--a), var(--siri-1), var(--siri-2), var(--siri-3), var(--siri-4), var(--siri-1));
  animation: spin 3.2s linear infinite;
}
.glow { inset: -6px; filter: blur(16px); }
.ring {
  inset: -2px; padding: 2px;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude; z-index: 1;
}
body.searching .glow { opacity: .55; }
body.searching .ring { opacity: 1; }

/* ---------- Search panel ---------- */
#searchPanel {
  position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px));
  opacity: 0; transition: opacity .25s var(--ease); pointer-events: none;
}
body.searching #searchPanel { opacity: 1; pointer-events: auto; }
.sp { padding-block: 28px; }
.sp-hint, .sp-count { color: var(--muted); font-size: 15px; margin: 0 0 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px 8px 10px; border-radius: 999px;
  background: hsl(var(--h) var(--t-s) var(--t-l2)); font-size: 15px; font-weight: 500;
}
.chip .ic { width: 18px; height: 18px; color: hsl(var(--h) var(--t-s) var(--t-ink)); }
.rows { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: var(--r-group); overflow: hidden; }
.rows li + li .row { box-shadow: inset 0 .5px 0 var(--hair); }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 64px; }
.row:active { background: var(--surface-2); }
.row-thumb { width: 46px; height: 46px; border-radius: 10px; overflow: hidden; flex: none; }
.row-thumb img { width: 100%; height: 100%; object-fit: cover; }
.row-thumb .ph .ic { width: 55%; height: 55%; }
.row-text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.row-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-sub { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-chev { color: var(--muted); width: 18px; height: 18px; opacity: .6; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
.sp-empty { text-align: center; color: var(--muted); padding: 40px 0; }

/* ---------- Sheet ---------- */
#scrim { position: fixed; inset: 0; z-index: 70; background: var(--scrim); opacity: 0; transition: opacity .35s var(--ease); }
#scrim.open { opacity: 1; }
#sheet {
  position: fixed; z-index: 80; left: 0; right: 0; bottom: 0; height: calc(100% - 44px - env(safe-area-inset-top, 0px));
  background: var(--bg); border-radius: 14px 14px 0 0; box-shadow: var(--shadow);
  transform: translateY(102%); transition: transform .5s var(--spring);
  display: flex; flex-direction: column; overflow: hidden;
}
#sheet.open { transform: none; }
.grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--hair); margin: 7px auto 0; flex: none; }
#sheetBody { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 820px) {
  #sheet {
    left: 50%; top: 50%; bottom: auto; right: auto; width: min(920px, calc(100vw - 64px)); height: auto; max-height: min(760px, calc(100vh - 64px));
    border-radius: 20px; transform: translate(-50%, -48%) scale(.96); opacity: 0;
    transition: transform .4s var(--spring), opacity .25s var(--ease);
  }
  #sheet.open { transform: translate(-50%, -50%); opacity: 1; }
  #sheet .grabber { display: none; }
}
.sheet-head {
  position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 8px 16px; min-height: 52px; background: var(--glass);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
}
.sheet-head > :first-child { justify-self: start; } .sheet-head > :last-child { justify-self: end; }
.sheet-head strong { font-weight: 600; }
.txt { color: var(--accent); font-size: 17px; padding: 6px 2px; }
.txt.strong { font-weight: 600; }

.detail { display: grid; gap: 20px; padding: 0 16px; }
@media (min-width: 820px) { .detail { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; padding: 4px 28px 8px; align-items: start; } }
.media { aspect-ratio: 1 / 1; max-width: 100%; border-radius: 18px; overflow: hidden; background: var(--surface-2); }
.media .ph .ic { width: 38%; height: 38%; stroke-width: 1.1; }
.detail-info { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.title-block h2 { margin: 0; font: 700 28px/1.15 var(--font-display); letter-spacing: -.02em; text-wrap: balance; }
.title-block p { margin: 4px 0 0; color: var(--muted); }
.cta {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 14px;
  background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 17px; padding: 0 20px;
}
.cta .ic { width: 18px; height: 18px; }
.cta:active { opacity: .85; }
.no-listing { font-size: 15px; color: var(--muted); margin: 0; }
.group { background: var(--surface); border-radius: var(--r-group); overflow: hidden; margin: 0; }
.kv { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 16px; min-height: 46px; }
.kv + .kv, .field + .field { box-shadow: inset 0 .5px 0 var(--hair); }
.kv dt { color: var(--muted); flex: none; }
.kv dd { margin: 0; text-align: right; min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; }
.mono { font-family: var(--font-mono); font-size: 15px; letter-spacing: 0; }
.copy { color: var(--accent); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; }
.copy .ic { width: 17px; height: 17px; }
.pill-cond { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 14px; font-weight: 500; background: var(--surface-2); }
.notes h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; padding-left: 16px; }
.notes p { margin: 0; background: var(--surface); border-radius: var(--r-group); padding: 12px 16px; line-height: 1.45; }

/* ---------- Forms ---------- */
.form { display: flex; flex-direction: column; gap: 22px; padding: 8px 16px 0; max-width: 620px; margin: 0 auto; }
.field { display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 48px; }
.field > span { width: 96px; flex: none; color: var(--fg); }
.field input, .field select, .field textarea {
  flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 12px 0; text-align: right; font-size: 17px;
}
.field select { direction: rtl; appearance: none; -webkit-appearance: none; color: var(--accent); }
.field select option { direction: ltr; }
.field textarea { text-align: left; resize: vertical; min-height: 96px; }
.field.stack { flex-direction: column; align-items: stretch; gap: 0; padding-top: 10px; }

.photo-pick .media { width: min(220px, 60vw); border-radius: 22px; }
.pp-actions { display: flex; gap: 20px; }
.err { color: var(--danger); font-size: 14px; margin: 0; text-align: center; }
.danger-btn { background: var(--surface); color: var(--danger); border-radius: var(--r-group); height: 50px; font-size: 17px; width: 100%; }
.danger-btn.armed { background: var(--danger); color: var(--accent-ink); font-weight: 600; }
.icon-pick, .hue-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; padding: 14px 16px; }
.icon-pick label, .hue-pick label { position: relative; aspect-ratio: 1 / 1; max-width: 100%; border-radius: 14px; display: grid; place-items: center; cursor: pointer; background: var(--surface-2); }
.icon-pick input, .hue-pick input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.icon-pick label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }
.hue-pick label { background: linear-gradient(155deg, hsl(var(--h) var(--t-s) var(--t-l1)), hsl(var(--h) var(--t-s) var(--t-l2))); border-radius: 50%; }
.hue-pick label:has(input:checked) { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent); }
.icon-pick label:has(input:focus-visible), .hue-pick label:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
.sec-label { margin: 0 0 6px 16px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }

/* ---------- Toast ---------- */
#toast {
  position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 90;
  transform: translate(-50%, 12px); opacity: 0; transition: opacity .25s, transform .35s var(--spring);
  background: var(--glass); box-shadow: var(--shadow), inset 0 0 0 .5px var(--glass-edge);
  -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);
  padding: 10px 18px; border-radius: 999px; font-size: 15px; font-weight: 500; max-width: calc(100vw - 32px); text-align: center;
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }

.hero-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }

const isAuthHash = () => /access_token=|error_description=|error=|refresh_token=/.test(location.hash);

  if (r.cat !== current.cat) {

}

function readPhoto(file) {

      const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg', .85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That file isn’t a photo this browser can open. Try a JPEG or PNG.')); };
    img.src = url;
  });
}

/* ---------- Move items saved only on this device ---------- */
async function importLegacy() {
  if (busy) return;
  const items = Legacy.pending(); if (!items.length) return;
  busy = true; closeSheet();
  const oldCats = (Legacy.state.categories || []);
  const catMap = {};
  let done = 0, failed = 0;
  try {
    for (const it of items) {
      const oc = oldCats.find(c => c.id === it.category) || { name: 'Other', icon: 'package', hue: 220 };
      if (!catMap[oc.id || oc.name]) {
        let nc = S.categories.find(c => c.name.trim().toLowerCase() === String(oc.name).trim().toLowerCase());
        if (!nc) {
          const position = S.categories.reduce((m, c) => Math.max(m, c.position), -1) + 1;
          const { data, error } = await sb.from('categories').insert({ name: oc.name, icon: oc.icon || 'package', hue: oc.hue ?? 212, position }).select().single();
          if (error) throw error;
          nc = fromCat(data); S.categories.push(nc);
        }
        catMap[oc.id || oc.name] = nc.id;
      }
      toast(`Moving ${done + failed + 1} of ${items.length}…`, 60000);
      try {
        const id = uuid();
        const photo_path = it.photo && String(it.photo).startsWith('data:') ? await uploadPhoto(id, it.photo) : null;
        const num = it.price === '' || it.price == null || isNaN(Number(it.price)) ? null : Number(it.price);
        const { error } = await sb.from('items').insert({
          id, category_id: catMap[oc.id || oc.name], name: it.name || 'Untitled', brand: it.brand || null, model: it.model || null, serial: it.serial || null,
          size: it.size || null, color: it.color || null, purchased: it.purchased || null, price: num, condition: it.condition || null,
          ebay: it.ebay || null, notes: it.notes || null, photo_path
        });
        if (error) throw error;
        done++;
      } catch (e) { failed++; }
    }
    if (!failed) await Legacy.markImported();
    await refresh(true);
    toast(failed ? `Moved ${done}. ${failed} didn’t make it. Try again to finish.` : `Moved ${plural(done, 'item')} to your account`, 3600);
  } catch (e) { toast('Couldn’t move your items. ' + friendly(e), 3600); }
  busy = false;
}

    return;
  }
  const hits = S.items.filter(i => [i.name, i.brand, i.model, i.serial, i.color, i.size, i.notes, catOf(i).name].join(' ').toLowerCase().includes(q));
  p.innerHTML = `<div class="wrap sp"><p class="sp-count">${plural(hits.length, 'result')}</p>
    ${hits.length ? `<ul class="rows">${hits.map(i => { const c = catOf(i); return `<li><a class="row" href="#${c.id}.${i.id}" data-act="search-go"><span class="row-thumb">${thumb(i, c, false)}</span><span class="row-text"><span class="row-title">${hl(i.name, q)}</span><span class="row-sub">${esc([i.brand, c.name].filter(Boolean).join(' · '))}</span></span>${icon('chevR', 'ic row-chev')}</a></li>`; }).join('')}</ul>`
    : `<p class="sp-empty">Nothing matches “${esc(raw.trim())}”.</p>`}</div>`;
}

/* ---------- Edit mode ---------- */
let editing = false;
function setEditing(on) {
  editing = on; document.body.classList.toggle('editing', on);
  const b = $('#btnEdit'); b.innerHTML = icon(on ? 'check' : 'pencil'); b.setAttribute('aria-pressed', on); b.setAttribute('aria-label', on ? 'Done editing' : 'Edit');
  if (on) toast(current.cat ? 'Tap a photo to edit it, or Add' : 'Tap a category to edit it');
}

/* ---------- Sign-in ---------- */
let sentEmail = '', resendT = null;
const redirectTo = () => location.origin + location.pathname;
function showAuth(msg) {
  document.body.classList.add('authing');
  $('#auth').hidden = false;
  closeSheet(); endSearch(); if (editing) setEditing(false);
  $('#authStep1').hidden = false; $('#authStep2').hidden = true;
  const e = $('#emailErr'); if (msg) { e.textContent = msg; e.hidden = false; } else e.hidden = true;
  setTimeout(() => $('#a-email').focus(), 50);
}
function hideAuth() { document.body.classList.remove('authing'); $('#auth').hidden = true; }
function startResendTimer() {
  const b = $('#resendBtn'); let s = 60; b.disabled = true;
  clearInterval(resendT);
  const tick = () => { b.textContent = s > 0 ? `Resend in ${s}s` : 'Resend email'; if (s <= 0) { b.disabled = false; clearInterval(resendT); } s--; };
  tick(); resendT = setInterval(tick, 1000);
}
async function sendLink(email) {
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: redirectTo(), shouldCreateUser: true } });
  if (error) throw error;
}
const authMsg = e => {
  const m = String(e && (e.message || e) || '');
  if (/rate|too many|security purposes/i.test(m)) return 'Too many emails sent. Wait a minute and try again.';
  if (/invalid.*email|email.*invalid/i.test(m)) return 'That email doesn’t look right. Check it and try again.';
  if (/expired|invalid.*(otp|token)|token.*(invalid|expired)/i.test(m)) return 'That code is wrong or expired. Check the latest email, or resend.';
  return friendly(e);
};
$('#emailForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('#a-email').value.trim(), err = $('#emailErr'), btn = $('#emailBtn');
  err.hidden = true;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = 'Enter your email address, like you@example.com.'; err.hidden = false; return; }
  setBusy(btn, true, 'Sending');
  try {
    await sendLink(email);
    sentEmail = email; $('#sentTo').textContent = email;
    $('#authStep1').hidden = true; $('#authStep2').hidden = false; $('#codeErr').hidden = true; $('#a-code').value = '';
    startResendTimer();
    setTimeout(() => $('#a-code').focus(), 50);
  } catch (x) { err.textContent = authMsg(x); err.hidden = false; }
  setBusy(btn, false);
});
$('#codeForm').addEventListener('submit', async e => {
  e.preventDefault();
  const token = $('#a-code').value.replace(/\D/g, ''), err = $('#codeErr'), btn = $('#codeBtn');
  err.hidden = true;
  if (token.length < 6) { err.textContent = 'Enter the code from the email.'; err.hidden = false; return; }
  setBusy(btn, true, 'Signing in');
  try {
    const { data, error } = await sb.auth.verifyOtp({ email: sentEmail, token, type: 'email' });
    if (error) throw error;
    setBusy(btn, false);
    if (data && data.session && !user) enter(data.session.user);
  } catch (x) { setBusy(btn, false); err.textContent = authMsg(x); err.hidden = false; }
});

let entering = false;
async function enter(u) {
  if (entering || (user && user.id === u.id && S)) return;
  entering = true;
  user = u; hideAuth();
  const cached = readCache();
  if (cached) { S = cached; current = { cat: undefined, item: null }; route(); }
  else $('#view').innerHTML = `<div class="loading-grid"><span class="spinner" aria-label="Loading"></span></div>`;
  await Legacy.open();
  try {
    await loadAll();
    await seedStarters();
    if (!cached) current = { cat: undefined, item: null };
    current.cat === undefined ? route() : rerender();
  } catch (e) {
    if (!cached) errorView(); else toast('You’re offline. Showing what was saved last.', 3200);
  }
  entering = false;
}
async function signOut() {
  if (busy) return;
  try { localStorage.removeItem(cacheKey()); } catch (e) {}
  closeSheet();
  await sb.auth.signOut().catch(() => {});
  user = null; S = null; current = { cat: undefined, item: null };
  history.replaceState(null, '', location.pathname);
  $('#view').innerHTML = '';
  showAuth();
}

/* ---------- Events ---------- */
document.addEventListener('click', async e => {
  const a = e.target.closest('[data-act], .tile[data-cat], .cell[data-item]');
  if (!a) return;
  const act = a.dataset.act;
  if (!act && a.matches('.tile[data-cat]')) { if (editing) { e.preventDefault(); catEditor(S.categories.find(c => c.id === a.dataset.cat)); } return; }
  if (!act && a.matches('.cell[data-item]')) {
    if (editing) { e.preventDefault(); itemEditor(S.items.find(i => i.id === a.dataset.item)); }
    else pushedItem = true;
    return;
  }
  switch (act) {
    case 'close': dismiss(); break;
    case 'account': openAccount(); break;
    case 'signout': signOut(); break;
    case 'refresh': { closeSheet(); const ok = await refresh(false); if (ok) toast('Up to date'); break; }
    case 'retry': enter(user); break;
    case 'import': importLegacy(); break;
    case 'resend': {
      a.disabled = true;
      try { await sendLink(sentEmail); toast('Sent another email'); startResendTimer(); }
      catch (x) { const er = $('#codeErr'); er.textContent = authMsg(x); er.hidden = false; a.disabled = false; }
      break;
    }
    case 'change-email': $('#authStep2').hidden = true; $('#authStep1').hidden = false; $('#a-email').focus(); break;
    case 'edit-item': itemEditor(S.items.find(i => i.id === a.dataset.id)); break;
    case 'cancel-edit': { if (busy) break; const it = a.dataset.id && S.items.find(i => i.id === a.dataset.id); if (it && current.item === it.id) openDetail(it); else closeSheet(); break; }
    case 'new-item': itemEditor(null, current.cat); break;
    case 'new-cat': catEditor(null); break;
    case 'remove-photo': draftPhoto = null; setPreview(); break;
    case 'copy': {
      const v = a.dataset.v;
      try { await navigator.clipboard.writeText(v); toast('Serial number copied'); }
      catch (_) { const r = document.createRange(); r.selectNodeContents(a.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selected. Copy it from here.'); }
      break;
    }
    case 'delete-item': case 'delete-cat': {
      if (busy) break;
      if (!a.classList.contains('armed')) { a.classList.add('armed'); a.dataset.label = a.textContent; a.textContent = 'Tap again to delete'; setTimeout(() => { if (a.isConnected && !busy) { a.classList.remove('armed'); a.textContent = a.dataset.label; } }, 3500); break; }
      setBusy(a, true, 'Deleting');
      try {
        if (act === 'delete-item') {
          const it = S.items.find(i => i.id === a.dataset.id);
          const { error } = await sb.from('items').delete().eq('id', it.id);
          if (error) throw error;
          removePhotos([it.photo_path]);
          S.items = S.items.filter(i => i.id !== it.id); writeCache(); busy = false;
          current.item = null; closeSheet(); history.replaceState(null, '', '#' + current.cat); pushedItem = false; rerender(); toast('Deleted');
        } else {
          const id = a.dataset.id, paths = itemsIn(id).map(i => i.photo_path);
          const { error } = await sb.from('categories').delete().eq('id', id);
          if (error) throw error;
          removePhotos(paths);
          S.categories = S.categories.filter(c => c.id !== id); S.items = S.items.filter(i => i.category !== id); writeCache(); busy = false;
          closeSheet(); rerender(); toast('Deleted');
        }
      } catch (x) {
        setBusy(a, false); a.classList.remove('armed'); a.textContent = a.dataset.label || 'Delete';
        toast('Couldn’t delete. ' + friendly(x), 3200);
      }
      break;
    }
    case 'search-go': endSearch(); pushedItem = /\./.test(a.getAttribute('href')); break;
  }
});
$('#btnSearch').innerHTML = icon('search');
$('#btnClose').innerHTML = icon('x');
$('#btnEdit').innerHTML = icon('pencil');
$('#btnSearch').addEventListener('click', startSearch);
$('#btnClose').addEventListener('click', endSearch);
$('#btnEdit').addEventListener('click', () => { if (sheetKind || !S) return; setEditing(!editing); });
$('#q').addEventListener('input', e => renderSearch(e.target.value));
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('#scrim').addEventListener('click', dismiss);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (sheetKind) dismiss(); else if (document.body.classList.contains('searching')) endSearch(); else if (editing) setEditing(false);
});
document.addEventListener('submit', e => {
  if (e.target.id === 'itemForm') { e.preventDefault(); saveItem(e.target); }
  if (e.target.id === 'catForm') { e.preventDefault(); saveCat(e.target); }
});
document.addEventListener('change', async e => {
  if (e.target.id === 'f-cat') setPreview();
  if (e.target.id === 'f-photo' && e.target.files[0]) {
    const er = $('#photoErr');
    try { draftPhoto = await readPhoto(e.target.files[0]); er.hidden = true; setPreview(); }
    catch (x) { er.textContent = x.message; er.hidden = false; }
    e.target.value = '';
  }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('label[for="f-photo"]')) { e.preventDefault(); $('#f-photo').click(); } });
addEventListener('hashchange', () => { if (isAuthHash()) return; if (!parse().item) pushedItem = false; route(); });

/* Pick up changes made on other devices when the app comes back into view */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && user && S && !busy && Date.now() - lastLoad > 15000 && sheetKind !== 'edit' && sheetKind !== 'cat') refresh(true);
});

/* Swipe the sheet down to close (phones) */
(() => {
  const sh = $('#sheet'), body = $('#sheetBody');
  let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => {
    if (innerWidth >= 820 || busy || e.target.closest('input, textarea, select')) return;
    if (body.scrollTop > 0 && !e.target.closest('.grabber, .sheet-head')) return;
    y0 = e.touches[0].clientY; dy = 0;
  }, { passive: true });
  sh.addEventListener('touchmove', e => {
    if (y0 == null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    if (dy > 0) { e.preventDefault(); sh.style.transition = 'none'; sh.style.transform = `translateY(${dy}px)`; }
  }, { passive: false });
  sh.addEventListener('touchend', () => {
    if (y0 == null) return; y0 = null; sh.style.transition = '';
    if (dy > 110) dismiss(); else sh.style.transform = '';
  });
})();

/* ---------- Boot ---------- */
(async () => {
  const minShow = wait(reduce ? 500 : 1750);
  const L = $('#loader');
  const done = () => { L.classList.add('done'); setTimeout(() => L.remove(), 650); };
  if (!sb) {
    await minShow; done();
    $('#view').innerHTML = `<header class="hero wrap"><h1 class="large">stuff</h1></header><div class="wrap"><div class="empty">${icon('cloudOff')}<p>stuff couldn’t start.<br>Check your connection, then reload the page.</p></div></div>`;
    return;
  }
  let linkErr = '';
  if (isAuthHash()) {
    const p = new URLSearchParams(location.hash.slice(1));
    if (p.get('error')) linkErr = /expired/i.test(p.get('error_code') || p.get('error_description') || '') ? 'That sign-in link expired. Enter your email to get a new one.' : 'That sign-in link didn’t work. Enter your email to get a new one.';
  }
  let session = null;
  try { session = (await sb.auth.getSession()).data.session; } catch (e) {}
  if (isAuthHash()) history.replaceState(null, '', location.pathname);
  sb.auth.onAuthStateChange((ev, s) => {
    if (ev === 'SIGNED_IN' && s && !user) setTimeout(() => enter(s.user), 0);
    if (ev === 'SIGNED_OUT' && user) setTimeout(() => { user = null; S = null; $('#view').innerHTML = ''; showAuth(); }, 0);
  });
  await minShow;
  if (session) { enter(session.user); done(); }
  else { showAuth(linkErr); done(); }
})();
})();
</script>
